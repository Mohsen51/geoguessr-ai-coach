[project]
name = "geocoach"
version = "0.1.0"
description = "GeoGuessr duel coaching CLI: review lost rounds with Claude, train on weak countries"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "pillow>=11",
    "numpy>=2",
    "pymupdf>=1.25",
    "pycountry>=24",
    "reverse-geocoder>=1.5",
    "mcp>=1.2",
    "rich>=13",
    "python-dotenv>=1",
    "typer>=0.15",
]

[project.scripts]
geocoach = "geocoach.cli:app"
geocoach-mcp = "geocoach.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geocoach"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
