name: Encyclopedia sheets

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Sync plonkit guides (paced, cached)
        run: uv run geocoach plonkit
      - name: Build sheets
        run: uv run geocoach build-sheets
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: encyclopedia/
          branch: chore/update-encyclopedia
          commit-message: "chore: update encyclopedia sheets from plonkit"
          title: "chore: update encyclopedia sheets from plonkit"
          body: |
            Weekly rebuild of `encyclopedia/` from the plonkit guides. Review the diff and merge.
          delete-branch: true
